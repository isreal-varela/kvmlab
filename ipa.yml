---
- name: Playbook to configure IPA server
  hosts: ipa_host
  become: true

  tasks:

  # ---------------------------------------------------------------------------
  - name: "Tasks specific to a 'downsteam' IPA server instance"
    block:

    - name: Mount the ISO file
      ansible.builtin.mount:
        path: "/mnt"
        src: "/dev/sr1"
        fstype: "iso9660"
        boot: false
        opts: "ro,noauto"
        state: mounted

    - name: "Check that the /etc/yum.repos.d/ipa-server-local.repo exists"
      ansible.builtin.stat:
        path: /etc/yum.repos.d/ipa-server-local.repo
      register: repofile_stat_result

    - name: "Upload 'ipa-server-local.repo' file"
      ansible.builtin.template:
        src: ipa-server-iso.repo.j2
        dest: "/etc/yum.repos.d/ipa-server-local.repo"
      when: not repofile_stat_result.stat.exists

    - name: Execute dnf update
      ansible.builtin.shell: |
        dnf --assumeno --nobest update
      when: not repofile_stat_result.stat.exists
      failed_when: false

    when: not ( is_upstream | default(false) )
  # ---------------------------------------------------------------------------

  - name: Get ethernet interface names to be used later for disabling ipv6
    ansible.builtin.shell: "set -o pipefail && nmcli connection show | grep ethernet | awk '{print $1}'"
    changed_when: false
    register: ethernet_interface_name

  - name: Disable IPv6 in Network Manager for the main ethernet device
    community.general.nmcli:
      type: ethernet
      conn_name: "{{ item }}"
      method6: disabled
      state: present
    #notify:
    #  - Restart network
    #  - Restart NetworkManager
    with_items: "{{ ethernet_interface_name.stdout_lines }}"


- name: Playbook to install IPA server
  hosts: ipa_host
  become: true
  roles:
  - role: ipaserver
    state: present
  tags: ipa_cfg_server

- name: DNS record manipulation/verification
  hosts: ipa_host
  become: true
  vars:
    ipparts: "{{ ansible_default_ipv4.address.split('.') }}"
    dnsrevzone_name: '{{ ipparts[2] }}.{{ ipparts[1] }}.{{ ipparts[0] }}.in-addr.arpa.'
    dnsrevrec_name: '{{ ipparts[3] }}'
    dnsrevrec_host: '{{ ansible_host }}.{{ dns_name }}.'
      
  tasks:

    - name: Ensure 'master/forward' zone exists
      ipadnszone:
        ipaadmin_password: '{{ ipaadmin_password }}'
        name: '{{ dns_name }}.'
      tags: ipa_cfg_server

    - name: Ensure 'reverse' zone exists
      ipadnszone:
        ipaadmin_password: '{{ ipaadmin_password }}'
        name: '{{ dnsrevzone_name }}'
      tags: ipa_cfg_server

- name: Cleanup IPA server
  hosts: ipa_host
  become: true

  tasks:

  - name: Disable 'APE Local DNF' repository
    ansible.builtin.yum_repository:
      name: '{{ local_dnf_repo }}'
      baseurl: /mnt
      enabled: false
    failed_when: false

  # Unmount ISO as should ONLY be req'd prior to and during ipa-server install (via role above)
  - name: Unmount the ISO
    ansible.builtin.mount:
      path: /mnt
      state: unmounted

- name: Playbook to configure IPA clients
  hosts: ipa_client
  become: true
  roles:
  - role: ipaclient
    state: present
  tags: ipa_cfg_client

- name: DNS record manipulation/verification
  hosts: ipa_client
  become: true
  vars:
    ipparts: "{{ ansible_default_ipv4.address.split('.') }}"
    dnsrevzone_name: '{{ ipparts[2] }}.{{ ipparts[1] }}.{{ ipparts[0] }}.in-addr.arpa.'
    dnsrevrec_name: '{{ ipparts[3] }}'
    dnsrevrec_host: '{{ ansible_host }}.{{ dns_name }}.'
      
  tasks:

    # - name: Ensure DNS 'A' record and reverse/PTR exists
    #   ipadnsrecord:
    #         ipaadmin_password: '{{ ipaadmin_password }}'
    #    name: '{{ ansible_host }}'
    #     zone_name: '{{ dns_name }}'
    #     record_type: 'A'
    #     record_value: '{{ ansible_default_ipv4.address }}'
    #     create_reverse: yes
    #   tags: ipa_cfg_client

    - name: Ensure DNS 'A' record exists for host
      ipadnsrecord:
        ipaadmin_password: '{{ ipaadmin_password }}'
        name: '{{ ansible_host }}'
        zone_name: '{{ dns_name }}'
        record_type: 'A'
        record_value: '{{ ansible_default_ipv4.address }}'
      tags: ipa_cfg_client

    - name: Ensure DNS 'PTR' record exists for host
      ipadnsrecord:
        ipaadmin_password: '{{ ipaadmin_password }}'
        name: '{{ dnsrevrec_name }}'
        zone_name: '{{ dnsrevzone_name }}'
        record_type: 'PTR'
        record_value: '{{ dnsrevrec_host }}'
      tags: ipa_cfg_client
