---

- name: Generate certificates for use with Foreman
  hosts: foreman_host
  become: true
  roles:
    - role: rhel-system-roles.certificate
      vars:
        certificate_requests:
          - name: "{{ inventory_hostname }}"
            dns: "{{ inventory_hostname }}.{{ dns_name }}"
            principal: "HTTP/{{ inventory_hostname }}.{{ dns_name }}@{{ dns_name | upper }}"
            ca: ipa
      when: ( is_upstream == false ) and ( not ( skip_cert | default( false ) ) )

- name: Playbook to install foreman
  hosts: foreman_host
  become: true

  tasks:

    - name: Create /opt/pulp folder [parent to additional folder(s) created during "foreman-installer" run]
      ansible.builtin.file:
        path: "/opt/pulp"
        recurse: true
        mode: 0775

    - name: Allow incoming traffic to the local host
      ansible.builtin.include_role:
        name: rhel-system-roles.firewall
      vars:
        firewall:
          - {zone: public,
             service: [http, https],
             port: ['53/udp', '53/tcp', '67/udp', '69/udp', '5647/tcp', '8000/tcp', '8140/tcp', '9090/tcp'],
             state: enabled}

    - name: Mount the ISO file
      ansible.builtin.mount:
        path: "/mnt"
        src: "/dev/sr1"
        fstype: "iso9660"
        boot: false
        opts: "ro,noauto"
        state: mounted

    - name: "Check that the /etc/yum.repos.d/foreman-local.repo exists"
      ansible.builtin.stat:
        path: /etc/yum.repos.d/foreman-local.repo
      register: repofile_stat_result

    - name: "Upload 'foreman-local.repo' file"
      ansible.builtin.template:
        src: foreman-iso.repo.j2
        dest: "/etc/yum.repos.d/foreman-local.repo"
      when: not repofile_stat_result.stat.exists

    - name: Execute dnf update
      ansible.builtin.shell: |
        dnf --assumeno --nobest update
      when: not repofile_stat_result.stat.exists
      failed_when: false

    - name: Download the foreman-installer-katello
      ansible.builtin.dnf:
        name: foreman-installer-katello
        state: present

    - name: Download the ansiblerole-foreman_scap_client
      ansible.builtin.dnf:
        name: ansiblerole-foreman_scap_client
        state: present

    - name: Execute foreman-installer (upstream-only)
      ansible.builtin.shell: |
        foreman-installer --scenario katello \
          --foreman-proxy-content-pulpcore-additional-export-paths /opt/pulp/exports \
          --foreman-proxy-content-pulpcore-additional-import-paths /opt/pulp/imports \
          --foreman-initial-admin-first-name='{{ dns_name | upper }}' \
          --foreman-initial-admin-last-name='Administator' \
          --foreman-initial-admin-username='admin' \
          --foreman-initial-admin-password='{{ vault_foreman_admin_pwd }}' \
          --enable-foreman-compute-libvirt \
          --enable-foreman-plugin-openscap \
          --enable-foreman-proxy-plugin-openscap \
          --enable-foreman-cli-openscap \
          --enable-foreman-plugin-ansible \
          --enable-foreman-proxy-plugin-ansible \
          -l INFO
      # register: fm_install_rc
      when: ( is_upstream == true ) or ( skip_cert | default( false ) )

    - name: Execute foreman-installer (downstream-only)
      ansible.builtin.shell: |
        foreman-installer --scenario katello \
          --certs-server-cert='/etc/pki/tls/certs/{{ inventory_hostname }}.crt' \
          --certs-server-key='/etc/pki/tls/private/{{ inventory_hostname }}.key' \
          --certs-server-ca-cert='/etc/ipa/ca.crt' \
          --foreman-proxy-content-pulpcore-additional-export-paths /opt/pulp/exports \
          --foreman-proxy-content-pulpcore-additional-import-paths /opt/pulp/imports \
          --foreman-initial-admin-first-name='{{ dns_name | upper }}' \
          --foreman-initial-admin-last-name='Administator' \
          --foreman-initial-admin-username='admin' \
          --foreman-initial-admin-password='{{ vault_foreman_admin_pwd }}' \
          --enable-foreman-compute-libvirt \
          --enable-foreman-plugin-openscap \
          --enable-foreman-proxy-plugin-openscap \
          --enable-foreman-cli-openscap \
          --enable-foreman-plugin-ansible \
          --enable-foreman-proxy-plugin-ansible \
          -l INFO
      # register: fm_install_rc
      when: ( is_upstream == false ) and ( not ( skip_cert | default( false ) ) )


      # HOLDING PEN FOR OTHER POSSIBLE CLI PARAMETERS
      #    --enable-foreman-plugin-remote-execution \
      #    --enable-foreman-proxy-plugin-remote-execution-ssh \
      #    --foreman-proxy-plugin-remote-execution-ssh-install-key=true \
      #    --foreman-proxy-ssl=true \
      #    --foreman-proxy-ssl-ca="/etc/pki/tls/certs/ca-bundle.crt" \
      #    --foreman-proxy-ssl-cert="/etc/pki/tls/certs/{{ inventory_hostname }}.crt" \
      #    --foreman-proxy-ssl-key="/etc/pki/tls/certs/private/{{ inventory_hostname }}.key"
      #    --foreman-db-password="admin" \
      #    --foreman-db-username="{{ vault_foreman_db_pwd }}"
      #    --foreman-client-cors-domains=
      #  --<many-many-more>

    - name: Disable 'APE Local DNF' repository
      ansible.builtin.yum_repository:
        name: '{{ local_dnf_repo }}'
        baseurl: /mnt
        enabled: false
      failed_when: false

    # Unmount ISO as should ONLY be req'd prior to and during "foreman-installer" execution
    - name: Unmount the ISO
      ansible.builtin.mount:
        path: /mnt
        state: unmounted

    - name: adding existing user 'ansible' to group 'pulp'
      user:
        name: ansible
        groups: pulp
        append: yes

