- name: Pre-config excluding foreman and ipa
  hosts: kvms    #,!foreman_host,!ipa_host
  gather_facts: false

  tasks:

    - name: "Disable list of internet-accessed repositories"
      become: true
      community.general.dnf_config_manager:
        name:
          - appstream
          - baseos
          - extras
        state: disabled
      vars:
        ansible_connection: ssh
        ansible_ssh_user: ansible
        ansible_become_user: root
        ansible_become_password: "{{ vault_kvm_os_usr_ans_pwd }}"
